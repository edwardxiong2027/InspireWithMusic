services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspire_with_music
      POSTGRES_USER: inspire
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspire -d inspire_with_music"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://inspire:local-development-only@postgres:5432/inspire_with_music
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
